<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">SPECTR</title>
  <desc id="desc">SPECTR wordmark in a sharp geometric style with a violet-to-electric-blue spectral accent.</desc>
  <defs>
    <linearGradient id="spectral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B66CFF"/>
      <stop offset="1" stop-color="#4B8DFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="280" rx="34" fill="#090711"/>
  <path d="M74 62h812" stroke="#28203B" stroke-width="2"/>
  <path d="M74 218h812" stroke="#28203B" stroke-width="2"/>
  <path d="M88 90h34v100H88z" fill="url(#spectral)" filter="url(#glow)"/>
  <text x="152" y="183" fill="#F7F3FF" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="16">SPECTR</text>
  <path d="M798 82l46 0-46 116h-46z" fill="url(#spectral)" opacity=".95"/>
  <text x="156" y="215" fill="#9E91B8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="7">SEE BEYOND THE DEFAULT</text>
</svg>